<!doctype html>
<html lang="ko">
<head>

<style>
:root{--ink:#3A3546;--mute:#6B6478;--paper:#FBF8F2;--card:#FFFDF9}
*{box-sizing:border-box}
html,body{margin:0;background:#D9D4CA}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all}
.page{position:relative;width:1920px;height:1080px;background:var(--paper);overflow:hidden;margin:0 auto 24px}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pill{position:absolute;left:72px;top:42px;font-size:24px;font-weight:700;color:#B04568;background:var(--card);border:2px solid #C9A85C;border-radius:999px;padding:4px 24px}
h1{position:absolute;left:72px;top:96px;margin:0;font:400 58px/1.15 'Do Hyeon',sans-serif;color:#2E2A3B}
.pg{position:absolute;right:60px;top:46px;font:30px 'Nanum Pen Script',cursive;color:var(--mute)}
.tree{position:absolute;left:72px;right:60px;top:178px;bottom:30px;display:flex;align-items:center}
.t{display:flex;align-items:center;gap:var(--gap,58px)}
.ch{display:flex;flex-direction:column;gap:var(--vg,10px)}
.box{isolation:isolate;position:relative;flex:none;text-align:center;background:var(--f);padding:7px 12px;font-size:22px;line-height:1.32;--b:var(--bd)}
.box::before,.box::after{z-index:-1;content:"";position:absolute;inset:-2px;border:2.4px solid var(--b);pointer-events:none}
.box::before{transform:rotate(.55deg)}
.box::after{transform:rotate(-.4deg);inset:0}
.box b{color:var(--h)}
.box .x{display:block;font-family:'Gowun Batang',serif;font-weight:700;font-size:20px;color:var(--mute)}
.box .x em{font-style:normal;color:var(--h)}
.no{color:#A8231B;font-weight:700}
.k-root{--f:#F3EEE6;--bd:#C9A85C;font:400 44px/1.15 'Do Hyeon',sans-serif;border-radius:50%;padding:34px 26px;color:#3A3546}
.k-root::before,.k-root::after{border-radius:50%}
.k-root::before{transform:rotate(3deg);inset:6px -3px}
.k-root::after{transform:rotate(-2deg);inset:-5px 2px}
.k-root small{display:block;margin-top:4px;font:400 26px/1.15 'Nanum Pen Script',cursive;color:#B04568}
.k-a{background:var(--f1);--b:var(--bd1);font:400 34px/1.2 'Do Hyeon',sans-serif;padding:13px 10px;color:#3A3546}
.k-a small{display:block;font:500 18px/1.3 'Noto Sans KR',sans-serif;color:var(--mute);margin-top:3px}
.k-b{background:var(--f2);--b:var(--bd2);font:400 28px/1.22 'Do Hyeon',sans-serif;padding:9px 10px;color:#3A3546}
.k-b small{display:block;font:500 17px/1.3 'Noto Sans KR',sans-serif;color:var(--mute);margin-top:2px}
.k-c{background:var(--card);--b:var(--bd2);border-radius:0;text-align:left;padding:6px 13px}
.k-p{background:var(--card);--b:var(--bd);border-radius:999px;padding:5px 14px;font-size:21px}
.k-p::before,.k-p::after{border-radius:999px}
.postit{position:absolute;width:470px;padding:16px 20px 14px;background:#FCEFA6;color:#4A4230;transform:rotate(-1.6deg);box-shadow:3px 7px 14px rgba(90,70,20,.22);font-size:20px;line-height:1.38}
.postit::before{content:"";position:absolute;left:50%;top:-14px;width:120px;height:28px;margin-left:-60px;background:rgba(201,168,92,.5);transform:rotate(2deg)}
.postit b{display:block;font:400 36px/1.05 'Nanum Pen Script',cursive;color:#B04568;margin-bottom:5px}
.postit ol{margin:0;padding-left:24px}
.postit em{font-style:normal;font-weight:700;color:#8A5A12}
.k-side{background:var(--card);--b:var(--bd);font-size:20px;line-height:1.3;padding:6px 8px;color:var(--mute)}
.k-side::before{border-style:dashed;transform:none}.k-side::after{display:none}
.k-dim{background:var(--card);--b:#DCD6CB;color:#8C8596;font-size:21px;padding:6px 10px}
.th-end{--bd:#B9A3D3;--f1:#E6DCF1;--bd1:#B9A3D3;--f2:#EFE8F6;--bd2:#C7B5DC;--h:#6A58A6;--a:#B9A3D3}
.th-sub{--bd:#D4A5B5;--f1:#F8E4EA;--bd1:#D4A5B5;--f2:#FBEEF2;--bd2:#DDB6C4;--h:#B04568;--a:#D4A5B5}
.th-obj{--bd:#9CC8AE;--f1:#DDEFE2;--bd1:#9CC8AE;--f2:#EAF5EC;--bd2:#AFD3BC;--h:#2F7A58;--a:#9CC8AE}
.th-rel{--bd:#D9B869;--f1:#F7ECC9;--bd1:#D9B869;--f2:#FBF4DE;--bd2:#E0C484;--h:#94690F;--a:#D9B869}
.th-emb{--bd:#9DBBD8;--f1:#DCE8F4;--bd1:#9DBBD8;--f2:#EBF2F9;--bd2:#AFC8DF;--h:#2C5A86;--a:#9DBBD8}
.th-gold{--bd:#C9A85C;--f1:#F3EEE6;--bd1:#C9A85C;--f2:#FBF8F2;--bd2:#D5BC82;--h:#7A5F1E;--a:#C9A85C}
.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ln path{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.pen{position:absolute;font:34px/1.15 'Nanum Pen Script',cursive;color:#B04568;white-space:nowrap}
.pen.gr{color:#5D8F63}.pen.pu{color:#6A58A6}
@page{size:1920px 1080px;margin:0}
@media print{html,body{background:none}.page{margin:0;break-after:page}.page:last-child{break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
body.solo{background:var(--paper)}body.solo .page{display:none;margin:0}body.solo .page.on{display:block}
</style>

{ pill:'1차시 · 문장 종결 표현', title:'문장을 어떻게 끝맺을까?', cols:[230,170,620,470], gap:60, vg:11,

const DECO = {

 heart:`<g fill="none" stroke="#D5CFC4" stroke-width="5" stroke-linecap="round"><path d="M1610 96c-14-18-34-6-22 12l22 22 22-22c12-18-8-30-22-12z"/><path d="M1678 128c-9-12-22-4-14 8l14 14 14-14c8-12-5-20-14-8z"/></g>`,
 tree:`<g fill="none" stroke="#CFE1C0" stroke-width="5" stroke-linecap="round"><circle cx="1640" cy="112" r="50"/><circle cx="1642" cy="114" r="47"/><path d="M1640 162V92M1640 122l-20-20M1640 138l23-22"/></g>`,
};
const wave = (`<path d="M0 0H1920V96C1560 160 1240 62 900 112C560 160 260 84 0 130Z" fill="#E9E2D5"/>`);
function html(nd, depth, cols){
  const k = nd.k, w = nd.w || cols[Math.min(depth, cols.length - 1)];
  const kids = nd.ch.length ? `<div class="ch">${nd.ch.map(x => html(x, depth + 1, cols)).join('')}</div>` : '';
  return `<div class="t ${nd.th || ''}"><div class="box k-${k}" style="width:${w}px">${nd.t}</div>${kids}</div>`;
}
P.forEach((p, i) => {

function wire(){
  document.querySelectorAll('.page').forEach(pg => {
    const b0 = pg.getBoundingClientRect(); if (!b0.width) return; const sv = pg.querySelector('svg.ln'); let h = '';
    pg.querySelectorAll('.t').forEach(t => {
      const ch = t.querySelector(':scope > .ch'); if (!ch) return;
      const pb = t.querySelector(':scope > .box').getBoundingClientRect();
      const x1 = pb.right - b0.left + 4, y1 = pb.top + pb.height/2 - b0.top;
      ch.querySelectorAll(':scope > .t').forEach(k => {
        const b = k.querySelector(':scope > .box'), r = b.getBoundingClientRect();
        const x2 = r.left - b0.left - 8, y2 = r.top + r.height/2 - b0.top, m = (x1 + x2) / 2, col = getComputedStyle(b).getPropertyValue('--a').trim() || '#C9A85C';
        h += `<path stroke="${col}"${b.classList.contains('k-side') ? ' stroke-dasharray="3 9"' : ''} d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/><path stroke="${col}" d="M${x2-11} ${y2-8}L${x2} ${y2}L${x2-11} ${y2+8}"/>`;
      });
    });
    sv.setAttribute('viewBox', '0 0 1920 1080'); sv.innerHTML = h;
    pg.querySelectorAll('.postit').forEach(n => { const tg = [...pg.querySelectorAll('.box')].find(b => b.textContent.trim() === n.dataset.on); if (!tg) return; const r = tg.getBoundingClientRect(); n.style.left = (r.left - b0.left - 40) + 'px'; n.style.top = (r.top - b0.top - n.offsetHeight - 26) + 'px'; });
  });
}
const Q = new URLSearchParams(location.search), solo = Q.get('p');
if (solo) { document.body.classList.add('solo'); document.querySelectorAll('.page')[+solo - 1].classList.add('on'); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
  wire();
  const out = [];
  document.querySelectorAll('.page').forEach((pg, i) => { if (solo && !pg.classList.contains('on')) return; const r = pg.getBoundingClientRect(); let t = 1e9, b = -1e9, rt = -1e9; pg.querySelectorAll('.box').forEach(e => { const q = e.getBoundingClientRect(); t = Math.min(t, q.top - r.top); b = Math.max(b, q.bottom - r.top); rt = Math.max(rt, q.right - r.left); }); out.push(`${i + 1}: top ${Math.round(t)} bottom ${Math.round(b)} right ${Math.round(rt)}`); });
  document.documentElement.dataset.check = out.join(' | ');
});
